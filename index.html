<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cristhian Aguilar | Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="container">
    
    <header class="sticky-top bg-white ">
      <nav class="row align-items-center justify-content-between"> 
        <a href="#sobre-mi" data-i18n="nav.about" class="col-md-2 ali"></a>
        <a href="#proyectos" data-i18n="nav.projects" class="col-md-2"></a>
        <a href="#tecnologias" data-i18n="nav.technologies" class="col-md-2"></a>
        <a href="#mision" data-i18n="nav.mission" class="col-md-2"></a>
        <a href="#contacto" data-i18n="nav.contact" class="col-md-2"></a>

        <select id="language" class="col-md-2">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </nav>

    </header>

    <main>
      
      <section id="inicio" class=" row text-center ">

        <img src="img/fotoprueba.jpg" class="col-md-6 img-fluid rounded-top"  />
    
        <div class="col-6 flex-column d-flex justify-content-center align-items-center">
        <h1 data-i18n="hero.title" class=""></h1 >
        <p data-i18n="hero.description" class=""></p>
        </div>
      </section>

      <section id="sobre-mi">
        <h2 data-i18n="about.title"></h2>
        <div data-i18n-array="about.paragraphs"></div>
      </section>

      <section id="mision">
        <h2 data-i18n="mission.title"></h2>
        <div data-i18n-array="mission.paragraphs"></div>
      </section>

      <section id="vision">
        <h2 data-i18n="vision.title"></h2>
        <div data-i18n-array="vision.paragraphs"></div>
      </section>

      <section id="tecnologias">
        <h2 data-i18n="technologies.title" class="md-2"></h2>
        <p data-i18n="technologies.description" class="text-muted "></p>
        <ul data-i18n-list="technologies.items" class="row row-cols-2 row-cols-md-4"></ul>
      </section>

      <section id="proyectos">
        <h2 data-i18n="projects.title"></h2>
        <div id="projects-container"></div>
      </section>

      <section id="aprendizaje">
        <h2 data-i18n="learning.title"></h2>
        <ul data-i18n-list="learning.items"></ul>
      </section>

      <section id="contacto">
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.description"></p>
        <ul>
          <li>
            <a href="https://github.com/ag-cris21" target="_blank" rel="noreferrer">
              <span data-i18n="contact.github"></span>
            </a>
          </li>
          <li>
            <span data-i18n="contact.email"></span>: crisaguilar212004@gmail.com
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <p data-i18n="footer.text"></p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/app.js"></script>
  </body>
</html>
