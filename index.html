<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cristhian Aguilar | Portfolio</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="#sobre-mi" data-i18n="nav.about"></a>
        <a href="#proyectos" data-i18n="nav.projects"></a>
        <a href="#tecnologias" data-i18n="nav.technologies"></a>
        <a href="#mision" data-i18n="nav.mission"></a>
        <a href="#contacto" data-i18n="nav.contact"></a>
      </nav>

      <select id="language">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </header>

    <main>
      <section id="inicio">
        <h1 data-i18n="hero.title"></h1>
        <p data-i18n="hero.description"></p>
      </section>

      <section id="sobre-mi">
        <h2 data-i18n="about.title"></h2>
        <div data-i18n-array="about.paragraphs"></div>
      </section>

      <section id="mision">
        <h2 data-i18n="mission.title"></h2>
        <div data-i18n-array="mission.paragraphs"></div>
      </section>

      <section id="vision">
        <h2 data-i18n="vision.title"></h2>
        <div data-i18n-array="vision.paragraphs"></div>
      </section>

      <section id="tecnologias">
        <h2 data-i18n="technologies.title"></h2>
        <p data-i18n="technologies.description"></p>
        <ul data-i18n-list="technologies.items"></ul>
      </section>

      <section id="proyectos">
        <h2 data-i18n="projects.title"></h2>
        <div id="projects-container"></div>
      </section>

      <section id="aprendizaje">
        <h2 data-i18n="learning.title"></h2>
        <ul data-i18n-list="learning.items"></ul>
      </section>

      <section id="contacto">
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.description"></p>
        <ul>
          <li>
            <a href="https://github.com/ag-cris21" target="_blank" rel="noreferrer">
              <span data-i18n="contact.github"></span>
            </a>
          </li>
          <li>
            <span data-i18n="contact.email"></span>: crisaguilar212004@gmail.com
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <p data-i18n="footer.text"></p>
    </footer>

    <script src="./js/app.js"></script>
  </body>
</html>
